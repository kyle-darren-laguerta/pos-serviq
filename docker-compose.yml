version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pos_serviq_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: serviq
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/bin:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    container_name: pos_serviq_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_DATABASE: serviq
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:3000
    container_name: pos_serviq_frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
